<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TradingView — Cryptocurrency & Forex Markets</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 32 32' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='32' height='32' rx='6' fill='%232962FF'/%3E%3Ctext x='4' y='24' font-family='Arial' font-weight='bold' font-size='20' fill='white'%3ETV%3C/text%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #131722;
      --bg-secondary: #1e222d;
      --bg-tertiary: #2a2e39;
      --border-color: #2a2e39;
      --accent: #2962FF;
      --green: #089981;
      --red: #f23645;
      --text-primary: #d1d4dc;
      --text-secondary: #787b86;
      --text-muted: #434651;
      --sidebar-width: 270px;
      --right-panel-width: 280px;
      --ticker-height: 40px;
      --symbol-info-height: 55px;
      --bottom-tab-height: 44px;
      --header-height: 0px;
      --transition-speed: 0.25s;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 13px;
      line-height: 1.4;
    }

    /* ─── TICKER TAPE ─── */
    #ticker-tape-wrapper {
      height: var(--ticker-height);
      width: 100%;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-secondary);
      overflow: hidden;
    }
    #ticker-tape-wrapper .tradingview-widget-container { height: 100%; width: 100%; }
    #ticker-tape-wrapper iframe { height: var(--ticker-height) !important; }

    /* ─── LAYOUT ─── */
    #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

    #main-area {
      display: flex;
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    /* ─── LEFT SIDEBAR ─── */
    #left-sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--bg-secondary);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: width var(--transition-speed) ease, margin var(--transition-speed) ease;
      overflow: hidden;
      position: relative;
    }
    #left-sidebar.collapsed { width: 0; border-right: none; }
    #left-sidebar .tradingview-widget-container { flex: 1; min-height: 0; }
    #left-sidebar iframe { height: 100% !important; }

    #sidebar-toggle {
      position: absolute;
      top: 8px;
      right: -28px;
      width: 28px;
      height: 28px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-left: none;
      border-radius: 0 4px 4px 0;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 10;
      transition: color 0.15s;
    }
    #sidebar-toggle:hover { color: var(--accent); }

    /* ─── CENTER ─── */
    #center-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg-primary);
    }

    /* Symbol Info Bar */
    #symbol-info-wrapper {
      height: var(--symbol-info-height);
      flex-shrink: 0;
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-secondary);
      overflow: hidden;
    }
    #symbol-info-wrapper .tradingview-widget-container { height: 100%; }
    #symbol-info-wrapper iframe { height: var(--symbol-info-height) !important; }

    /* Main Chart */
    #chart-wrapper {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    #chart-wrapper .tradingview-widget-container {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
    }
    #chart-wrapper iframe { width: 100% !important; height: 100% !important; }

    /* Bottom Tab Bar */
    #bottom-tab-bar {
      height: var(--bottom-tab-height);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      padding: 0 8px;
      gap: 2px;
      overflow-x: auto;
    }
    #bottom-tab-bar::-webkit-scrollbar { height: 0; }

    .bottom-tab {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 6px 12px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 12px;
      border-radius: 4px 4px 0 0;
      white-space: nowrap;
      transition: background 0.15s, color 0.15s;
      font-family: inherit;
    }
    .bottom-tab:hover { background: var(--bg-tertiary); color: var(--text-primary); }
    .bottom-tab.active { background: var(--bg-primary); color: var(--accent); }

    /* Bottom Panel Content */
    #bottom-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      background: var(--bg-primary);
      border-top: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    #bottom-panel.open { max-height: 350px; }
    #bottom-panel-inner {
      display: flex;
      height: 350px;
      padding: 0;
    }
    #bottom-panel-inner .tradingview-widget-container { flex: 1; height: 100%; }
    #bottom-panel-inner iframe { height: 100% !important; }

    #bottom-panel-close {
      position: absolute;
      top: 4px;
      right: 8px;
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      z-index: 5;
      padding: 2px 6px;
      border-radius: 3px;
    }
    #bottom-panel-close:hover { color: var(--text-primary); background: var(--bg-tertiary); }

    /* ─── RIGHT PANEL ─── */
    #right-panel {
      width: var(--right-panel-width);
      flex-shrink: 0;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      transition: width var(--transition-speed) ease, margin var(--transition-speed) ease;
      overflow: hidden;
    }
    #right-panel.collapsed { width: 0; border-left: none; }

    #right-panel-toggle {
      position: absolute;
      top: 8px;
      left: -28px;
      width: 28px;
      height: 28px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-right: none;
      border-radius: 4px 0 0 4px;
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      z-index: 10;
      transition: color 0.15s;
    }
    #right-panel-toggle:hover { color: var(--accent); }

    #right-panel { position: relative; }

    /* Right Panel Tabs */
    #right-tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }
    #right-tabs button {
      flex: 1;
      padding: 8px 4px;
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 11px;
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
      text-align: center;
    }
    #right-tabs button:hover { color: var(--text-primary); }
    #right-tabs button.active { color: var(--accent); border-bottom-color: var(--accent); }

    #right-panel-content {
      flex: 1;
      min-height: 0;
      position: relative;
    }
    #right-panel-content > div {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: none;
    }
    #right-panel-content > div.active { display: block; }
    #right-panel-content iframe { height: 100% !important; }

    /* ─── UTILITY ─── */
    .tv-container { height: 100%; width: 100%; position: relative; }
    .tv-container .tradingview-widget-container { height: 100%; width: 100%; }

    /* ─── MOBILE ─── */
    @media (max-width: 768px) {
      :root {
        --sidebar-width: 0px;
        --right-panel-width: 0px;
        --ticker-height: 36px;
        --symbol-info-height: 48px;
      }
      #left-sidebar { position: fixed; top: var(--ticker-height); left: 0; bottom: 0; z-index: 100; width: 260px; transform: translateX(-100%); transition: transform 0.3s ease; border-right: 1px solid var(--border-color); }
      #left-sidebar.open-mobile { transform: translateX(0); }
      #sidebar-toggle { display: none; }
      #mobile-sidebar-btn { display: flex !important; }
      #right-panel { display: none; }
    }
    @media (min-width: 769px) {
      #mobile-sidebar-btn { display: none !important; }
      #mobile-sidebar-overlay { display: none !important; }
    }

    #mobile-sidebar-btn {
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      border-radius: 4px;
      margin-right: 4px;
    }
    #mobile-sidebar-btn:hover { background: var(--bg-tertiary); color: var(--text-primary); }

    #mobile-sidebar-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 99;
      display: none;
    }
    #mobile-sidebar-overlay.open { display: block; }

    /* Loading placeholder */
    .widget-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 12px;
    }
  </style>
</head>

<!-- ═══ TRADINGVIEW ADVANCED CHART ═══ -->
<script src="https://s3.tradingview.com/tv.js"></script>
<script>
(function() {
  'use strict';

  // ─── STATE ───
  const state = {
    currentSymbol: 'BITSTAMP:BTCUSD',
    leftCollapsed: false,
    rightCollapsed: false,
    bottomOpen: false,
    currentBottomTab: null
  };

  // ─── DOM REFS ───
  const chartContainer = document.getElementById('tv-chart');
  const leftSidebar = document.getElementById('left-sidebar');
  const rightPanel = document.getElementById('right-panel');
  const sidebarToggle = document.getElementById('sidebar-toggle');
  const rightPanelToggle = document.getElementById('right-panel-toggle');
  const bottomPanel = document.getElementById('bottom-panel');
  const bottomPanelClose = document.getElementById('bottom-panel-close');
  const bottomTabs = document.querySelectorAll('.bottom-tab[data-tab]');
  const rightTabs = document.querySelectorAll('#right-tabs button');
  const rightContentPanels = document.querySelectorAll('#right-panel-content > div');
  const mobileSidebarBtn = document.getElementById('mobile-sidebar-btn');
  const mobileOverlay = document.createElement('div');
  mobileOverlay.id = 'mobile-sidebar-overlay';
  document.body.appendChild(mobileOverlay);

  // ─── INIT ADVANCED CHART ───
  var widget = new TradingView.widget({
    "container_id": "tv-chart",
    "width": "100%",
    "height": "100%",
    "symbol": state.currentSymbol,
    "interval": "60",
    "timezone": "Etc/UTC",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "toolbar_bg": "#131722",
    "enable_publishing": false,
    "allow_symbol_change": true,
    "save_image": true,
    "details": true,
    "studies": [
      "RSI@tv-basicstudies",
      "MASimple@tv-basicstudies",
      "Volume@tv-basicstudies"
    ],
    "hide_top_toolbar": false,
    "hide_legend": false,
    "withdateranges": true,
    "show_popup_button": true,
    "popup_width": "1000",
    "popup_height": "650",
    "support_host": "https://www.tradingview.com",
    "hotlist": true,
    "calendar": true
  });

  // ─── UPDATE SYMBOL IN ALL WIDGETS ───
  function setSymbol(symbol) {
    state.currentSymbol = symbol;

    // Update main chart
    try { widget.setSymbol(symbol); } catch(e) {}

    // Update Technical Analysis widget (right panel)
    // We can't easily re-render TradingView's external widgets after load,
    // but the technical analysis widget on the right panel will be reloaded
    // by swapping its iframe src. TradingView doesn't expose a JS API for
    // symbol update on the technical-analysis embed, so we reload it.
    reloadWidget('right-technical', 'technical-analysis');
    reloadWidget('symbol-info-wrapper', 'symbol-info');
  }

  // ─── RELOAD A TRADINGVIEW EXTERNAL WIDGET ───
  function reloadWidget(containerId, scriptTargetId) {
    const container = document.getElementById(containerId);
    if (!container) return;

    // Find the script tag inside this container that loads an external widget
    const scripts = container.querySelectorAll('script[src*="external-embedding"]');
    scripts.forEach(function(script) {
      try {
        var oldSrc = script.src;
        // Force reload by appending a timestamp
        script.src = oldSrc.split('?')[0] + '?t=' + Date.now();
      } catch(e) {}
    });
  }

  // ─── LEFT SIDEBAR TOGGLE ───
  sidebarToggle.addEventListener('click', function() {
    state.leftCollapsed = !state.leftCollapsed;
    leftSidebar.classList.toggle('collapsed', state.leftCollapsed);
    sidebarToggle.innerHTML = state.leftCollapsed ? '▶' : '◀';
    window.dispatchEvent(new Event('resize'));
  });

  // ─── RIGHT PANEL TOGGLE ───
  rightPanelToggle.addEventListener('click', function() {
    state.rightCollapsed = !state.rightCollapsed;
    rightPanel.classList.toggle('collapsed', state.rightCollapsed);
    rightPanelToggle.innerHTML = state.rightCollapsed ? '◀' : '▶';
    window.dispatchEvent(new Event('resize'));
  });

  // ─── BOTTOM TABS ───
  bottomTabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      var tabName = this.getAttribute('data-tab');
      toggleBottomPanel(tabName);
    });
  });

  function toggleBottomPanel(tabName) {
    // Hide all bottom content panels
    document.querySelectorAll('#bottom-panel-inner > .tv-container').forEach(function(el) {
      el.style.display = 'none';
    });

    if (state.bottomOpen && state.currentBottomTab === tabName) {
      // Close panel
      bottomPanel.classList.remove('open');
      state.bottomOpen = false;
      state.currentBottomTab = null;
      bottomTabs.forEach(function(t) { t.classList.remove('active'); });
    } else {
      // Open panel with selected tab
      var target = document.getElementById('bottom-' + tabName);
      if (target) target.style.display = 'block';
      bottomPanel.classList.add('open');
      state.bottomOpen = true;
      state.currentBottomTab = tabName;
      bottomTabs.forEach(function(t) {
        t.classList.toggle('active', t.getAttribute('data-tab') === tabName);
      });
      // Re-trigger widget sizing
      setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 100);
    }
  }

  bottomPanelClose.addEventListener('click', function() {
    bottomPanel.classList.remove('open');
    state.bottomOpen = false;
    state.currentBottomTab = null;
    bottomTabs.forEach(function(t) { t.classList.remove('active'); });
  });

  // ─── RIGHT PANEL TABS ───
  rightTabs.forEach(function(tab) {
    tab.addEventListener('click', function() {
      var tabId = this.getAttribute('data-tab');
      rightTabs.forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
      rightContentPanels.forEach(function(p) { p.classList.remove('active'); });
      var target = document.getElementById(tabId);
      if (target) target.classList.add('active');
      setTimeout(function() { window.dispatchEvent(new Event('resize')); }, 100);
    });
  });

  // ─── MOBILE SIDEBAR ───
  mobileSidebarBtn.addEventListener('click', function() {
    leftSidebar.classList.toggle('open-mobile');
    mobileOverlay.classList.toggle('open');
  });

  mobileOverlay.addEventListener('click', function() {
    leftSidebar.classList.remove('open-mobile');
    mobileOverlay.classList.remove('open');
  });

  // ─── KEYBOARD SHORTCUTS ───
  document.addEventListener('keydown', function(e) {
    // Alt+W = toggle watchlist sidebar
    if (e.altKey && e.key === 'w') { e.preventDefault(); sidebarToggle.click(); }
    // Alt+R = toggle right panel
    if (e.altKey && e.key === 'r') { e.preventDefault(); rightPanelToggle.click(); }
    // Alt+B = toggle bottom panel
    if (e.altKey && e.key === 'b') {
      e.preventDefault();
      if (state.bottomOpen) { bottomPanelClose.click(); }
      else { toggleBottomPanel('calendar'); }
    }
  });

  // ─── RESIZE HANDLER ───
  var resizeTimer;
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function() {
      // TV chart auto-resizes, but we can fire a resize event
      // for any iframes that need it
    }, 200);
  });

  // ─── TRADINGVIEW CROSS-WIDGET COMMUNICATION ───
  // TradingView widgets broadcast symbol changes via postMessage.
  // We listen for these to keep things in sync.
  window.addEventListener('message', function(event) {
    try {
      var data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
      // TradingView broadcasts 'symbolChange' or similar
      if (data && data.symbol && data.name === 'symbolChanged') {
        // Only update if it's not our own chart's event (avoid loops)
        if (data.symbol !== state.currentSymbol) {
          setSymbol(data.symbol);
        }
      }
      // Watchlist click broadcasts a symbol
      if (data && data.symbol && typeof data.symbol === 'string' && data.symbol.indexOf(':') > 0) {
        if (data.symbol !== state.currentSymbol) {
          setSymbol(data.symbol);
        }
      }
    } catch(e) {}
  }, true);

  // Also override TradingView's symbol change via click on chart
  widget.onChartReady(function() {
    widget.chart().onSymbolChanged(function() {
      // The chart symbol changed (user typed new symbol)
      var sym = widget.symbol();
      if (sym && sym !== state.currentSymbol) {
        state.currentSymbol = sym;
        reloadWidget('right-technical', 'technical-analysis');
        reloadWidget('symbol-info-wrapper', 'symbol-info');
      }
    });
  });

  // ─── ACTIVE WATCHLIST SYMBOL CLICK ───
  // When user clicks a symbol in the watchlist, we need to detect it.
  // TradingView's watchlist embed fires a window.postMessage on click.
  // We already have the message listener above that catches 'symbolChanged'.
  // Additionally, we can poll for changes:
  var lastSymbol = state.currentSymbol;
  setInterval(function() {
    try {
      var sym = widget.symbol();
      if (sym && sym !== lastSymbol) {
        lastSymbol = sym;
        state.currentSymbol = sym;
        reloadWidget('right-technical', 'technical-analysis');
        reloadWidget('symbol-info-wrapper', 'symbol-info');
      }
    } catch(e) {}
  }, 2000);

  console.log('TradingView platform initialized. Active symbol:', state.currentSymbol);
  console.log('Keyboard shortcuts: Alt+W (watchlist), Alt+R (right panel), Alt+B (bottom panel)');

})();
</script>

</body>
